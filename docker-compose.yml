services:
  postgres:
    image: postgres:16-alpine
    container_name: kalshi-bet-postgres
    environment:
      POSTGRES_USER: kalshi
      POSTGRES_PASSWORD: kalshi
      POSTGRES_DB: kalshi_bet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalshi -d kalshi_bet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
